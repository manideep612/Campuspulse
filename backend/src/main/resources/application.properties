# CampusPulse Backend Configuration
server.port=8080

# MySQL Database Configuration
# Automatically creates the database 'campuspulse_db' if it does not already exist
spring.datasource.url=jdbc:mysql://localhost:3306/campuspulse?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
# Read from environment variable MYSQL_PASSWORD or fallback to root
# You can change 'root' below to your MySQL password if different
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
